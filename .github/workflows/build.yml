name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Auto Setup Full Android Project & App
        run: |
          ns=$(python3 -c 'print(bytes.fromhex("687474703a2f2f736368656d61732e616e64726f69642e636f6d2f61706b2f7265732f616e64726f6964").decode())')

          # १. मुख्य प्रोजेक्ट फाईल्स तयार करा
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "SagarMedicineReminder"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          kotlin.jvm.target.validation.mode=ignore
          EOF

          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/java/com/sagar/medicinereminder

          # २. app/build.gradle तयार करा
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.sagar.medicinereminder'
              compileSdk 34
              defaultConfig {
                  applicationId "com.sagar.medicinereminder"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # ३. AndroidManifest.xml तयार करा
          printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="%s">\n<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n<application android:allowBackup="true" android:label="Sagar Medicine Reminder" android:theme="@style/Theme.AppCompat.Light.DarkActionBar">\n<activity android:name=".CreateProfileActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity>\n<activity android:name=".MainActivity" android:exported="false" />\n<receiver android:name=".ReminderReceiver" android:enabled="true" android:exported="false" />\n</application>\n</manifest>' "$ns" > app/src/main/AndroidManifest.xml

          # ४. प्रोफाईल स्क्रीन लेआउट (activity_create_profile.xml)
          printf '<?xml version="1.0" encoding="utf-8"?>\n<LinearLayout xmlns:android="%s" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:padding="24dp" android:gravity="center_horizontal">\n<TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Create Your Profile" android:textSize="22sp" android:textStyle="bold" android:layout_marginBottom="20dp" />\n<ImageView android:id="@+id/ivProfilePic" android:layout_width="110dp" android:layout_height="110dp" android:src="@android:drawable/ic_menu_camera" android:background="#E0E0E0" android:scaleType="centerCrop" android:layout_marginBottom="16dp" />\n<EditText android:id="@+id/etUserName" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="Enter Full Name" android:inputType="textPersonName" android:layout_marginBottom="12dp" />\n<EditText android:id="@+id/etUserAge" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="Enter Age" android:inputType="number" android:layout_marginBottom="24dp" />\n<Button android:id="@+id/btnSaveProfile" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Save Profile and Continue" />\n</LinearLayout>' "$ns" > app/src/main/res/layout/activity_create_profile.xml

          # ५. ReminderReceiver.kt तयार करा (अलार्म वाजण्यासाठी)
          cat << 'EOF' > app/src/main/java/com/sagar/medicinereminder/ReminderReceiver.kt
          package com.sagar.medicinereminder

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.media.RingtoneManager
          import android.os.Build
          import androidx.core.app.NotificationCompat

          class ReminderReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val medName = intent.getStringExtra("MEDICINE_NAME") ?: "Medicine Time"
                  val nm = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  val channelId = "med_reminder_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val ch = NotificationChannel(channelId, "Medicine Reminder", NotificationManager.IMPORTANCE_HIGH)
                      nm.createNotificationChannel(ch)
                  }
                  val sound = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)
                  val notif = NotificationCompat.Builder(context, channelId)
                      .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                      .setContentTitle("औषध घेण्याची वेळ झाली आहे!")
                      .setContentText(medName)
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setSound(sound)
                      .setAutoCancel(true)
                      .build()
                  nm.notify(System.currentTimeMillis().toInt(), notif)
              }
          }
          EOF

          # ६. CreateProfileActivity.kt तयार करा
          cat << 'EOF' > app/src/main/java/com/sagar/medicinereminder/CreateProfileActivity.kt
          package com.sagar.medicinereminder

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.widget.Button
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity

          class CreateProfileActivity : AppCompatActivity() {
              private var profileImageUri: String = ""
              private lateinit var ivProfilePic: ImageView
              private val pickImage = registerForActivityResult(ActivityResultContracts.GetContent()) { uri: Uri? ->
                  if (uri != null) { profileImageUri = uri.toString(); ivProfilePic.setImageURI(uri) }
              }
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val sharedPref = getSharedPreferences("UserProfile", Context.MODE_PRIVATE)
                  if (sharedPref.getBoolean("isProfileCreated", false)) {
                      startActivity(Intent(this, MainActivity::class.java))
                      finish()
                      return
                  }
                  setContentView(R.layout.activity_create_profile)
                  ivProfilePic = findViewById(R.id.ivProfilePic)
                  val etUserName = findViewById<EditText>(R.id.etUserName)
                  val etUserAge = findViewById<EditText>(R.id.etUserAge)
                  val btnSaveProfile = findViewById<Button>(R.id.btnSaveProfile)
                  ivProfilePic.setOnClickListener { pickImage.launch("image/*") }
                  btnSaveProfile.setOnClickListener {
                      val name = etUserName.text.toString().trim()
                      val age = etUserAge.text.toString().trim()
                      if (name.isEmpty() || age.isEmpty()) {
                          Toast.makeText(this, "कृपया नाव आणि वय टाका", Toast.LENGTH_SHORT).show()
                          return@setOnClickListener
                      }
                      sharedPref.edit().apply {
                          putString("userName", name)
                          putString("userAge", age)
                          putString("profilePhoto", profileImageUri)
                          putBoolean("isProfileCreated", true)
                          apply()
                      }
                      startActivity(Intent(this, MainActivity::class.java))
                      finish()
                  }
              }
          }
          EOF

          # ७. MainActivity.kt तयार करा (तुमचा पूर्ण कोड इथे असावा)
          cat << 'EOF' > app/src/main/java/com/sagar/medicinereminder/MainActivity.kt
          
